<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>2人用支出管理アプリ（モック）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 現在ログイン中のユーザ（Aさん/Bさん）の切替 -->
  <header>
    <label>ログインユーザ:
      <select id="current-user"></select>
    </label>
  </header>

  <!-- 簡易ナビゲーション（SPA的に section の表示/非表示を切り替える） -->
  <nav>
    <button id="nav-home">ホーム</button>
    <button id="nav-add">支出登録</button>
    <button id="nav-settlement">清算申請</button>
  </nav>

  <!-- ホーム画面 -->
  <section id="home" class="active">
    <h2>ホーム</h2>

    <!-- 清算申請がある場合にメッセージと承認/却下ボタンを表示 -->
    <h3>清算通知</h3>
    <p id="settlement-msg">現在清算はありません</p>

    <h3>支出一覧</h3>
    <table>
      <thead>
        <tr>
          <th>日付</th>
          <th>支払者</th>
          <th>カテゴリ</th>
          <th>金額</th>
          <th>メモ</th>
          <th>登録者</th>
          <th>操作</th>
          <th>最終更新</th>
        </tr>
      </thead>
      <tbody id="expense-list"></tbody>
    </table>

    <!-- 読み物としての清算履歴（合計額のみ） -->
    <h3>清算履歴</h3>
    <ul id="settlement-history"></ul>
  </section>

  <!-- 支出登録画面 -->
  <section id="add">
    <h2>支出登録</h2>
    <form id="expense-form">
      <label>支払者: <input type="text" id="payer" readonly></label><br>
      <label>金額:<input type="number" id="amount" required min="1" step="1" inputmode="numeric"></label>
      <label>日付: <input type="date" id="date"></label><br>
      <label>カテゴリ: <input type="text" id="category"></label><br>
      <label>メモ: <input type="text" id="memo"></label><br>
      <button type="submit">保存</button>
    </form>
  </section>

  <!-- 清算申請画面（差額計算の文言と申請ボタン） -->
  <section id="settlement">
    <h2>清算申請</h2>
    <p id="settlement-info">差額計算中...</p>
    <button id="settle-btn">清算申請</button>
  </section>

  <!-- ESM（モジュール）でエントリーポイントを読み込む -->
  <script type="module" src="app/main.js"></script>
</body>
</html>
